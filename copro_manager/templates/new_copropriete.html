{% extends "base.html" %}

{% block title %}Ajouter une Copropriété{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <i class="fas fa-plus me-2"></i>Ajouter une Nouvelle Copropriété
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('new_copropriete') }}">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="numero" class="form-label">Numéro <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="numero" name="numero" required>
                            </div>
                            <div class="col-md-6">
                                <label for="date_mise_copropriete" class="form-label">Date Mise en Copropriété</label>
                                <input type="date" class="form-control" id="date_mise_copropriete" name="date_mise_copropriete">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="programme_neolia" class="form-label">Programme Néolia</label>
                            <input type="text" class="form-control" id="programme_neolia" name="programme_neolia">
                        </div>

                        <div class="mb-3">
                            <label for="adresse" class="form-label">Adresse <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="adresse" name="adresse" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="ville" class="form-label">Ville <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="ville" name="ville" required>
                            </div>
                            <div class="col-md-6">
                                <label for="immatriculation" class="form-label">Immatriculation</label>
                                <input type="text" class="form-control" id="immatriculation" name="immatriculation">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="nombre_logements" class="form-label">Nombre de Logements <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="nombre_logements" name="nombre_logements" required min="0">
                            </div>
                            <div class="col-md-4">
                                <label for="exercice_comptable" class="form-label">Exercice Comptable</label>
                                <select class="form-select" id="exercice_comptable" name="exercice_comptable">
                                    <option value="" selected disabled>Sélectionnez...</option>
                                    <option value="30-juin">30-juin</option>
                                    <option value="31-déc">31-déc</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="gestionnaire" class="form-label">Gestionnaire</label>
                                <select class="form-select" id="gestionnaire" name="gestionnaire">
                                    <option value="" selected disabled>Sélectionnez...</option>
                                    <option value="AJ">AJ</option>
                                    <option value="KS">KS</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <a href="{{ url_for('index') }}" class="btn btn-secondary me-2">
                                <i class="fas fa-times me-1"></i>Annuler
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
