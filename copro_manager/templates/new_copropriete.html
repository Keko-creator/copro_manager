{% extends "base.html" %}

{% block title %}Nouvelle Copropriété - Copro Manager{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('index') }}"><i class="fas fa-home"></i> Accueil</a></li>
                <li class="breadcrumb-item active" aria-current="page">Nouvelle Copropriété</li>
            </ol>
        </nav>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h1><i class="fas fa-plus"></i> Ajouter une Nouvelle Copropriété</h1>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="numero" class="form-label">Numéro <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="numero" name="numero" required>
                            <div class="form-text">Numéro unique de la copropriété</div>
                        </div>
                        <div class="col-md-6">
                            <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nom" name="nom" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="adresse" class="form-label">Adresse <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="adresse" name="adresse" required>
                        </div>
                        <div class="col-md-6">
                            <label for="ville" class="form-label">Ville <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="ville" name="ville" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="date_mise_copropriete" class="form-label">Date Mise en Copropriété</label>
                            <input type="text" class="form-control" id="date_mise_copropriete" name="date_mise_copropriete" placeholder="JJ/MM/AAAA">
                        </div>
                        <div class="col-md-4">
                            <label for="nombre_logements" class="form-label">Nombre de Logements</label>
                            <input type="number" class="form-control" id="nombre_logements" name="nombre_logements">
                        </div>
                        <div class="col-md-4">
                            <label for="exercice_comptable" class="form-label">Exercice Comptable</label>
                            <input type="text" class="form-control" id="exercice_comptable" name="exercice_comptable" placeholder="31-déc">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="gestionnaire" class="form-label">Gestionnaire</label>
                            <input type="text" class="form-control" id="gestionnaire" name="gestionnaire">
                        </div>
                        <div class="col-md-6">
                            <label for="programme_neolia" class="form-label">Programme Neolia</label>
                            <input type="text" class="form-control" id="programme_neolia" name="programme_neolia">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="immatriculation" class="form-label">Immatriculation</label>
                            <input type="text" class="form-control" id="immatriculation" name="immatriculation">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Annuler
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
